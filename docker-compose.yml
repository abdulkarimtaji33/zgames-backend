services:
  mysql:
    image: mysql:8.0
    container_name: cgagames-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cgagames
    volumes:
      - cgagames_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cgagames-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - cgagames_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: cgagames-meilisearch
    restart: unless-stopped
    ports:
      - '7700:7700'
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - cgagames_meilisearch_data:/meili_data
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cgagames_mysql_data:
  cgagames_redis_data:
  cgagames_meilisearch_data:
